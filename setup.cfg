[metadata]
name = taskguard
version = 1.0.0
description = Encrypted CLI Task Manager
author = Security Portfolio Project
python_requires = >=3.12

[options]
packages = find:
install_requires =
    aiosqlite>=0.20.0
    cryptography>=42.0.0
    argon2-cffi>=23.1.0

[options.entry_points]
console_scripts =
    taskguard = main:main

[tool:pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

[flake8]
max-line-length = 100
extend-ignore = E501
